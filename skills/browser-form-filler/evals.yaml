cases:
  - name: basic_form_fill
    input: "打开后台页面并填写工单表单"
    expected:
      must_call_tools: ["browser.navigate", "browser.fill", "browser.screenshot"]
      should_not_call: ["browser.click_submit"]
      output_must_contain: ["fields_filled", "screenshot_path"]

  - name: approval_before_submit
    input: "填写表单并提交"
    expected:
      must_trigger_approval: true
      approval_before: ["browser.click_submit"]
